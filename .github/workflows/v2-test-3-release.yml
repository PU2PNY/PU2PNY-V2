name: PU2PNY-V2 TEST-3 image (xombe AMBE codec / ARMv6)
on:
  push:
    branches: [build/v2-test-3]
    paths:
      - '.github/workflows/v2-test-3-release.yml'
      - 'ci/build-v2-test-3.py'
      - 'ci/patch-image-v2-test-3.py'
      - 'ci/build-xombe-arm32.sh'
      - 'ci/arm-linux-gnueabihf-armv6.cmake'
      - 'third_party/xombe/**'
      - 'ci/patch-image-v2-test-2.py'
      - 'ci/patch-image-v2-test-1.py'
      - 'ci/prepare-v2-test-2-backend.py'
      - 'ci/prepare-v2-backend.py'
      - 'panel/**'
  workflow_dispatch:
env:
  SOURCE_COMMIT: ${{ github.sha }}
  BOARD: '32'
permissions:
  contents: read
concurrency:
  group: pu2pny-v2-test-3-image
  cancel-in-progress: true
jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.9'
          cache: false
      - name: Build and test the V2 panel backend (ARMv6)
        shell: bash
        run: |
          set -euo pipefail
          export GO111MODULE=off CGO_ENABLED=0
          export GOOS=linux GOARCH=arm GOARM=6
          python3 ci/prepare-v2-test-2-backend.py "$RUNNER_TEMP/backend" arm32
          python3 ci/test-5.13.py
          python3 ci/test-5.15.py
          cd "$RUNNER_TEMP/backend"
          env -u GOOS -u GOARCH -u GOARM go test ./...
          go build -trimpath -o "$RUNNER_TEMP/2pnyd" .
          file "$RUNNER_TEMP/2pnyd" | grep -Eq 'ELF 32-bit.*ARM'
      - name: Install image + codec build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user-static binfmt-support xz-utils e2fsprogs util-linux iproute2 curl \
            cmake gcc-arm-linux-gnueabihf file
          sudo update-binfmts --enable qemu-arm || true
      - name: Build + self-test + cross-compile xombe (ARMv6hf)
        shell: bash
        run: |
          set -euo pipefail
          bash ci/build-xombe-arm32.sh "$RUNNER_TEMP/xombe"
          file "$RUNNER_TEMP/xombe/xombe-xc" | grep -Eq 'ELF 32-bit.*ARM'
          ! file "$RUNNER_TEMP/xombe/xombe-xc" | grep -Eqi 'aarch64|ARM64'
      - name: Build the TEST-3 image on the proven 5.12.002 base
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pu2pny"
          curl -fL --retry 5 --retry-all-errors --connect-timeout 25 \
            "https://github.com/PU2PNY/2PNY-OS/releases/download/pu2pny-v5.12.002-p2/pu2pny-${BOARD}-5.12.002.img.xz" \
            -o "$RUNNER_TEMP/pu2pny/pu2pny-${BOARD}-5.12.002.img.xz"
          sudo python3 ci/build-v2-test-3.py "$RUNNER_TEMP/pu2pny" "$SOURCE_COMMIT" "$RUNNER_TEMP/2pnyd" "$RUNNER_TEMP/xombe"
      - uses: actions/upload-artifact@v4
        with:
          name: pu2pny-v2-test-3-32
          path: ${{ runner.temp }}/pu2pny/output/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
  publish:
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_COMMIT }}
      - uses: actions/download-artifact@v4
        with:
          name: pu2pny-v2-test-3-32
          path: artifacts
      - name: Verify integrity and publish for physical testing
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          image="pu2pny-32-v2-test-3.img.xz"
          test -s "$image"
          xz -t "$image"
          sha256sum -c "$image.sha256"
          jq -e --arg sha "$SOURCE_COMMIT" \
            '.build=="PU2PNY-V2-TEST-3" and .architecture=="32" and .source_commit==$sha and .validation.HW=="NOT_VERIFIED" and .validation.PROD=="NOT_APPROVED"' \
            BUILD-INFO-32.json
          cat > RELEASE-NOTES.md <<'EOF'
          # PU2PNY-V2 — TEST-3 (xombe AMBE codec para crossmode / ARMv6)

          **Imagem de TESTE. Não aprovada. Nada validado em hardware.** Grave com Rufus/Etcher.
          Base: TEST-2 (Raspbian 5.12.002), caminho RF Normal INTOCADO. Crossmode é OPT-IN e
          vem DESLIGADO (ENABLED=0): sem ligar, o hotspot funciona igual ao TEST-2.

          Novo: codec AMBE **xombe** (MIT, C99) — AMBE 2400 (D-Star) + AMBE+2 (DMR/YSF),
          transcodificação D-Star<->DMR em espaço de parâmetros. Cross-compilado ARMv6 hard-float
          (roda no Pi Zero W e no Pi 4), auto-teste (88/88) e verificação sob qemu passaram na CI.
          Instalado: /usr/local/bin/xombe-{xc,dec,enc}; /etc/2pny/crossmode.conf (ganhos provados
          do XLX026: D-Star->DMR/YSF=-20, DMR/YSF->D-Star=+19; EQ/gate off); wrapper
          /usr/local/sbin/2pny-crossmode-xombe; serviço pu2pny-crossmode.service (DESLIGADO).

          AINDA PENDENTE: botão Crossmode no painel e o roteamento RF ao vivo (streaming) — o
          codec e o ganho configurável já estão prontos e testados. Nota de patente: o README do
          xombe avisa que patentes AMBE podem estar em vigor em algumas jurisdições; distribuído sob
          a licença MIT dele, por decisão do dono.
          EOF
          gh release create pu2pny-v2-test-3 \
            ./pu2pny-32-v2-test-3.img.xz ./pu2pny-32-v2-test-3.img.xz.sha256 ./BUILD-INFO-32.json \
            --repo "$GITHUB_REPOSITORY" --target "$SOURCE_COMMIT" --prerelease \
            --title 'PU2PNY-V2 TEST-3 (xombe AMBE codec, crossmode opt-in/OFF) — TEST, não aprovado' \
            --notes-file RELEASE-NOTES.md
          gh release view pu2pny-v2-test-3 --repo "$GITHUB_REPOSITORY" --json tagName,assets
