<!doctype html><html lang="pt-BR" data-theme="dark" class="pny-i18n-pending"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark light"><title>PU2PNY-V2</title>
<link rel="icon" type="image/png" href="favicon.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<script>(function(){document.documentElement.setAttribute('data-theme',localStorage.getItem('pu2pny-theme')||'dark')})();</script>
<link rel="stylesheet" href="ui.css"><link rel="stylesheet" href="pny-v2.css">
</head><body><div class="shell">
<header class="topnav">
  <div class="brand"><img class="brandmark" src="favicon.png" alt="PU2PNY"><span class="brandtext"><b style="font-size:19px">PU2PNY-V2</b><small>Histórico</small></span></div>
  <nav class="nav" id="mainNav"></nav>
  <div class="navtools"><span class="pill"><span id="clockLocal">--:--:--</span></span><button class="btn" id="themeToggle">☀ Claro</button></div>
</header>
<main class="main">
<div class="top"><div><h1>Histórico</h1><p>Resumo de atividade do hotspot.</p></div><button class="btn" id="refresh">Atualizar agora</button></div>
<section class="section"><div class="grid4">
  <article class="card" data-real-only><small class="muted">Eventos 24h</small><div class="big" id="events24">—</div></article>
  <article class="card" data-real-only><small class="muted">RF → Internet</small><div class="big" id="rf2net">—</div></article>
  <article class="card" data-real-only><small class="muted">Internet → RF</small><div class="big" id="net2rf">—</div></article>
  <article class="card" data-real-only><small class="muted">Protocolo mais usado</small><div class="big" id="topProto">—</div></article>
</div></section>
<section class="section"><div class="grid2">
  <article class="card"><h2>Destinos mais usados</h2><div class="rows" id="topTargets"><div class="muted">Aguardando dados...</div></div></article>
  <article class="card"><h2>Indicativos mais ativos</h2><div class="rows" id="topCalls"><div class="muted">Aguardando dados...</div></div></article>
</div></section>
</main></div>
<script src="ui-common.js"></script><script>
PNY.nav('history');PNY.initTheme();
function rows(host,list,fmt){if(!list||!list.length){PNY.q(host).innerHTML='<div class="muted">Sem registros.</div>';return}PNY.q(host).innerHTML=list.slice(0,10).map(fmt).join('')}
async function load(){try{var d=await PNY.getj('/api/history/summary'),s=d.summary||d;
  PNY.q('events24').textContent=s.events_24h!=null?PNY.formatNumber(s.events_24h):(s.events!=null?PNY.formatNumber(s.events):'—');
  PNY.q('rf2net').textContent=s.rf_to_internet!=null?PNY.formatNumber(s.rf_to_internet):'—';
  PNY.q('net2rf').textContent=s.internet_to_rf!=null?PNY.formatNumber(s.internet_to_rf):'—';
  PNY.q('topProto').textContent=s.top_protocol||'—';
  rows('topTargets',s.top_targets||s.destinations,function(x){return '<div class="row"><span>'+PNY.esc(x.target||x.name||'—')+'</span><b>'+PNY.esc((x.count!=null?x.count:x.value)||'—')+'</b></div>'});
  rows('topCalls',s.top_callsigns||s.callsigns,function(x){return '<div class="row"><span>'+PNY.esc(x.callsign||x.name||'—')+'</span><b>'+PNY.esc((x.count!=null?x.count:x.value)||'—')+'</b></div>'});
  PNY.sweepRealOnly(document);
}catch(e){PNY.q('topTargets').innerHTML='<div class="muted">Histórico indisponível.</div>'}}
PNY.q('refresh').onclick=load;load();setInterval(function(){if(!document.hidden)load()},30000);
</script></body></html>
