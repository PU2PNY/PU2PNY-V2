<!doctype html><html lang="pt-BR" data-theme="dark" class="pny-i18n-pending"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark light"><title>PU2PNY-V2</title>
<link rel="icon" type="image/png" href="favicon.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<script>(function(){document.documentElement.setAttribute('data-theme',localStorage.getItem('pu2pny-theme')||'dark')})();</script>
<link rel="stylesheet" href="ui.css"><link rel="stylesheet" href="pny-v2.css">
<style>.msg{display:grid;grid-template-columns:auto 1fr auto;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}.msg:last-child{border-bottom:0}.msg .dir{font-size:10px;font-weight:900;padding:2px 8px;border-radius:999px;border:1px solid var(--line);align-self:start}.msg .dir.in{color:var(--green)}.msg .dir.out{color:var(--blue)}.msg .when{font-size:11px;color:var(--muted);white-space:nowrap}</style>
</head><body><div class="shell">
<header class="topnav">
  <div class="brand"><img class="brandmark" src="favicon.png" alt="PU2PNY"><span class="brandtext"><b style="font-size:19px">PU2PNY-V2</b><small>APRS / D-PRS</small></span></div>
  <nav class="nav" id="mainNav"></nav>
  <div class="navtools"><span class="pill"><span id="clockLocal">--:--:--</span></span><button class="btn" id="themeToggle">☀ Claro</button></div>
</header>
<main class="main">
<div class="top"><div><h1>APRS / D-PRS</h1><p>Mensagens APRS. Esta instalação não publica posição, GPS nem beacon; o APRS é usado somente para mensagens.</p></div><button class="btn" id="refresh">Atualizar agora</button></div>
<section class="section"><div class="grid2">
<article class="card"><h2>Enviar mensagem</h2>
  <label>Indicativo destino</label><input id="to" placeholder="Ex.: PU2ABC" autocapitalize="characters" maxlength="9">
  <label>Mensagem</label><textarea id="text" rows="3" maxlength="67" placeholder="Mensagem (até 67 caracteres)"></textarea>
  <button class="btn primary" id="send" style="margin-top:10px">Enviar</button>
  <p id="sendResult" class="statusmsg"></p>
  <div class="rows" style="margin-top:10px">
    <div class="row" data-real-only><span>Login APRS-IS</span><b id="login">—</b></div>
    <div class="row" data-real-only><span>Último RX</span><b id="lastRx">—</b></div>
    <div class="row" data-real-only><span>Última mensagem TX</span><b id="lastTx">—</b></div></div>
</article>
<article class="card"><h2>Mensagens</h2><div id="messages"><div class="muted">Sem mensagens.</div></div></article>
</div></section>
</main></div>
<script src="ui-common.js"></script><script>
PNY.nav('aprs');PNY.initTheme();
var params=new URLSearchParams(location.search);if(params.get('to'))PNY.q('to').value=params.get('to');
async function load(){try{var d=await PNY.getj('/api/aprs'),st=d.status||{},msgs=st.messages||[];
  PNY.q('login').textContent=st.login_state||st.login||'—';PNY.q('lastRx').textContent=st.last_rx?PNY.fmtTime(st.last_rx):'—';PNY.q('lastTx').textContent=st.last_tx?PNY.fmtTime(st.last_tx):'—';
  var host=PNY.q('messages');
  if(!msgs.length){host.innerHTML='<div class="muted">Sem mensagens.</div>'}
  else host.innerHTML=msgs.slice(-40).reverse().map(function(m){var dir=m.direction==='in'?'in':'out';return '<div class="msg"><span class="dir '+dir+'">'+(dir==='in'?'RX':'TX')+'</span><div><b>'+PNY.esc(m.station||'—')+'</b><div class="muted">'+PNY.esc(m.text||'')+'</div></div><span class="when">'+PNY.esc(PNY.fmtTime(m.timestamp))+'</span></div>'}).join('');
  PNY.sweepRealOnly(document);
}catch(e){}}
PNY.q('send').onclick=async function(){var to=PNY.q('to').value.trim().toUpperCase(),text=PNY.q('text').value.trim();
  if(!to||!text){PNY.q('sendResult').textContent='Informe o indicativo de destino e a mensagem.';return}
  var op=PNY.operation('Enviando mensagem APRS','Publicando via APRS-IS e aguardando confirmação...');
  try{await PNY.getj('/api/aprs/message',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({to:to,text:text}),pnySilent:true},15000);op.done('Mensagem enviada.');PNY.q('text').value='';setTimeout(load,800)}
  catch(e){op.error(e.message);PNY.q('sendResult').textContent=e.message}
};
PNY.q('refresh').onclick=load;load();setInterval(function(){if(!document.hidden)load()},8000);
</script></body></html>
